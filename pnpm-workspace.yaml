packages:
  - apps/*
  - packages/*

# true = allowed to run install scripts. Everything else is refused.
allowBuilds:
  esbuild: true

# One version per shared dependency. Packages reference these with "catalog:".
catalog:
  "@effect/platform-node": 4.1.6
  "@effect/sql-pg": 4.1.6
  "@effect/sql-pglite": 4.1.6
  "@effect/tsgo": 0.73.7
  "@effect/vitest": 4.1.6
  "@react-email/ui": 6.11.16
  "@tailwindcss/vite": 4.3.5
  "@tanstack/react-query": 5.108.4
  "@tanstack/react-query-devtools": 5.108.4
  "@tanstack/react-table": 9.3.1
  "@types/node": 26.6.11
  "@types/react": ~19.3.3
  "@types/react-dom": ~19.3.0
  "@vitejs/plugin-react": 6.3.0
  # The version of the Vitest that Vite+ bundles.
  "@vitest/browser-playwright": 5.1.1
  effect: 4.1.6
  kysely: 0.29.9
  lucide-react: 1.81.0
  # @vitejs/plugin-react 6.3 accepts >=0.152.0 <0.157.0.
  oxc-transform-react: 0.156.0
  playwright: 1.65.1
  react: 19.3.1
  react-dom: 19.3.1
  react-email: 6.11.16
  tailwindcss: 4.3.5
  tsrs: 7.1.0-beta.tsrs4
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vite-plus: 1.8.0
  vitest-browser-react: 2.3.0

overrides:
  # Every package that asks for Vite or Vitest gets the Vite+ build, so there is one copy.
  vite: "catalog:"
  # Two Effect copies do not share services or schemas.
  effect: "catalog:"
  # Vite+ pins its own tsrs, for type-aware lint: one copy, so the lint and `typecheck:ci` agree.
  tsrs: "catalog:"
  "@effect/vitest>vitest": "-"
