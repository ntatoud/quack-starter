name: Setup
description: Install Vite+, Node.js, pnpm, and the workspace dependencies, and restore the task cache.
inputs:
  task-cache-key:
    description: Name of the job's task cache. Jobs that run different tasks use different keys.
    required: true
  chromium:
    description: Install the Chromium that the component tests run in.
    default: "false"
runs:
  using: composite
  steps:
    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@v1
      with:
        node-version-file: .node-version
        run-install: false

    # node_modules itself, not the pnpm store: a hit skips `vp install`. Saved right after the
    # install, before any task writes its own cache in it. A PR reads the entry main saved.
    - name: Restore node_modules
      id: node-modules
      uses: actions/cache/restore@v6
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('.node-version', 'pnpm-lock.yaml') }}

    - name: Install dependencies
      if: steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: vp install --frozen-lockfile

    - name: Save node_modules
      if: steps.node-modules.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: ${{ steps.node-modules.outputs.cache-primary-key }}

    # The lockfile pins the Playwright version, which pins the browser build.
    - name: Restore Chromium
      id: chromium
      if: inputs.chromium == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

    # No `--with-deps`: the runner image already has the system libraries Chromium needs, and apt
    # mirrors are one more thing that can be down.
    - name: Install Chromium
      if: inputs.chromium == 'true' && steps.chromium.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm --filter @quack/form exec playwright install --only-shell chromium

    # `vp run --cache` replays a task whose inputs did not change. The cache lives in
    # node_modules, so it has to be carried between runs. A cache entry never updates,
    # so each commit saves its own and restores the most recent one.
    - name: Restore task cache
      uses: actions/cache@v6
      with:
        path: node_modules/.vite/task-cache
        key: task-cache-${{ runner.os }}-${{ inputs.task-cache-key }}-${{ github.sha }}
        restore-keys: |
          task-cache-${{ runner.os }}-${{ inputs.task-cache-key }}-
