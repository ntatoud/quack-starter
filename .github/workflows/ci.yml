name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          task-cache-key: lint
      - name: Format and lint
        run: vp check
      - name: Unused files, exports, and dependencies
        run: vp run -w knip

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          task-cache-key: typecheck
      # tsrs here, tsc locally. Both run through effect-tsgo, so both report the Effect diagnostics.
      - name: Typecheck
        run: vp run -r --cache typecheck:ci

  # The web app's tests take the longest, most of them in a browser: they get a job of their own.
  test:
    name: Test (${{ matrix.shard.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { name: web, filter: "--filter @quack/web" }
          # Every package but the web app and the root, whose own `test` runs every package again. A
          # package added later lands here.
          - { name: others, filter: "--filter '!@quack/web' --filter '!@quack/monorepo'" }
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          task-cache-key: test-${{ matrix.shard.name }}
          chromium: true
      - name: Test
        run: vp run ${{ matrix.shard.filter }} --cache test

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          task-cache-key: build
      - name: Build
        run: vp run --filter './apps/*' --cache build
