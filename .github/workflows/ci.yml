name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          task-cache-key: lint
      - name: Format and lint
        run: vp check
      - name: Unused code, duplication, and complexity
        run: vp run -w fallow

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          task-cache-key: typecheck
      # tsrs here, tsc locally. Both run through effect-tsgo, so both report the Effect diagnostics.
      - name: Typecheck
        run: vp run -r --cache typecheck:ci

  # The web app's tests take the longest, most of them in a browser: they get a job of their own.
  test:
    name: Test (${{ matrix.shard.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { name: web, filter: "--filter @quack/web" }
          # Every package but the web app and the root, whose own `test` runs every package again. A
          # package added later lands here.
          - { name: others, filter: "--filter '!@quack/web' --filter '!@quack/monorepo'" }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          task-cache-key: test-${{ matrix.shard.name }}
          chromium: true
      - name: Test
        run: vp run ${{ matrix.shard.filter }} --cache test

  # On a real Postgres: the suites of the Postgres adapters, which the other test jobs skip without TEST_DATABASE_URL.
  database:
    name: Database
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: quack
          POSTGRES_PASSWORD: quack
          POSTGRES_DB: quack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U quack"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://quack:quack@127.0.0.1:5432/quack
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          task-cache-key: database
      - name: Postgres adapters
        working-directory: apps/server
        run: vp test run postgres

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          task-cache-key: build
      - name: Build
        run: vp run --filter './apps/*' --cache build
