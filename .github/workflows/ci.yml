name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          task-cache-key: lint
      - name: Format and lint
        run: vp check
      - name: Unused files, exports, and dependencies
        run: vp run -w knip

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          task-cache-key: typecheck
      # tsrs here, tsc locally. Both run through effect-tsgo, so both report the Effect diagnostics.
      - name: Typecheck
        run: vp run -r --cache typecheck:ci

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          task-cache-key: test
      # Component tests (*.test.tsx) run in a real browser.
      - name: Install Chromium
        run: pnpm --filter @quack/form exec playwright install --with-deps --only-shell chromium
      - name: Test
        run: vp run -r --cache test

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          task-cache-key: build
      - name: Build
        run: vp run --filter './apps/*' --cache build
