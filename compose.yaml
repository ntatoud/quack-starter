# Dev only: the credentials are written here on purpose. Every worktree shares this one container.
name: quack

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: quack
      POSTGRES_PASSWORD: quack
      POSTGRES_DB: quack
    ports:
      - "127.0.0.1:54320:5432"
    volumes:
      - quack-postgres:/var/lib/postgresql
    # Over TCP: during its first start, the image runs a server on the socket only, then restarts it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U quack -d quack"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 60s
      start_interval: 1s

  # Catches every mail the server sends in dev. Under portless (`portless compose up`), its inbox is at
  # https://mailpit.quack.localhost; without it, at http://localhost:8025. SMTP is not HTTP: it keeps its port.
  mailpit:
    image: axllent/mailpit:v1.31
    labels:
      portless.ports: "8025"
    ports:
      - "127.0.0.1:10250:1025"
      - "127.0.0.1:8025:8025"

  # Opt-in, started by `pnpm dev:telemetry` through `portless compose`, which routes its ports:
  # Grafana, with the traces and the logs, at https://telemetry.quack.localhost, and OTLP at https://4318.telemetry.quack.localhost.
  otel-lgtm:
    image: grafana/otel-lgtm:0.41.1
    profiles: [observability]
    labels:
      portless.name: telemetry
      portless.ports: "3000,4318"
    ports:
      - "127.0.0.1::3000"
      - "127.0.0.1::4318"

volumes:
  quack-postgres:
